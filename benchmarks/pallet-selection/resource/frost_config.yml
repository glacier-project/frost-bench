time_precision: MSECS
logging_level: ERROR
reactors:
  frost_bus:
    logging_level: ERROR
    parameters:
      data_model_path: "resource/data-model/bus.yml"
  conveyor:
    logging_level: ERROR
    parameters:
      data_model_path: "resource/data-model/conveyor.yml"
      conveyor_graph: "resource/conveyor-graph.gml"
      # pallet_metric: "DISTANCE"
    reactors:
      conveyor_belt:
        reactors:
          Segment_1:
            parameters:
              segment_time: 12700
          Segment_2:
            parameters:
              segment_time: 20200
          Segment_3:
            parameters:
              segment_time: 13250
          Segment_4:
            parameters:
              segment_time: 4800
          Segment_5:
            parameters:
              segment_time: 6900
          Segment_6:
            parameters:
              segment_time: 14500
          Segment_7:
            parameters:
              segment_time: 20200
          Segment_8:
            parameters:
              segment_time: 12700
          EM:
            parameters:
              mutex_time: 2500
          HB:
            parameters:
              interchange_time: 4800
  scheduler:
    logging_level: ERROR
    parameters:
      data_model_path: "resource/data-model/scheduler.yml"
      # scheduling_instance: "resource/instance/instance_medium.json"
      wh_tasks: 70
      mill_tasks: 70
      rbtc_tasks: 70
      qc_tasks: 70
      min_task_spacing: 25 # seconds
      max_task_spacing: 35 # seconds
      task_mapping:
        ToWarehouseAndBack: /Scheduler/ToWarehouseAndBack
        ToQcAndBack: /Scheduler/ToQcAndBack
        ToRbtcAndBack: /Scheduler/ToRbtcAndBack
        ToMillAndBack: /Scheduler/ToMillAndBack
        WaitPalletAtSegment: /Scheduler/WaitPalletAtSegment
