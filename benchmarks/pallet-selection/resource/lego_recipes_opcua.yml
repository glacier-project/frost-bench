time_precision: MSECS
logging_level: ERROR
reactors:
  frost_bus:
    logging_level: ERROR
    parameters:
      data_model_path: "resource/data-model/bus.yml"
  conveyor:
    logging_level: ERROR
    parameters:
      data_model_path: "resource/data-model/opcua_conveyor_full.yml"
      conveyor_graph: "resource/conveyor-graph.gml"
  scheduler:
    logging_level: ERROR
    parameters:
      data_model_path: "resource/data-model/lego_3_scheduler.yml"
      scheduling_instance: "resource/instance/simulation-lego-demo-3.json"
      task_mapping:
        RBTC: /Scheduler/RBTC
        QC: /Scheduler/QC
        RESERVE: /Scheduler/RESERVE
        PUT_BACK: /Scheduler/PUT_BACK
  cell5:
    logging_level: ERROR
    parameters:
      data_model_path: "resource/data-model/opcua_cell5.yml"
  cell4:
    logging_level: ERROR
    parameters:
      data_model_path: "../../ice-frost/resources/data_model/cell4.yml"
