time_precision: MSECS
logging_level: ERROR
reactors:
  frost_bus:
    logging_level: ERROR
    parameters:
      data_model_path: "resource/data-model/bus.yml"
  conveyor:
    logging_level: ERROR
    parameters:
      data_model_path: "resource/data-model/opcua_conveyor_full.yml"
      conveyor_graph: "resource/conveyor-graph.gml"
      max_task_spacing: 30
  scheduler:
    logging_level: ERROR
    parameters:
      data_model_path: "resource/data-model/lego_scheduler.yml"
      scheduling_instance: "../../ice-frost/resources/schedules/simulation-lego-demo.json"
      task_mapping:
        LD: /Scheduler/LD
        RBTC: /Scheduler/RBTC
        QC: /Scheduler/QC
        DISASSEMBLE: /Scheduler/DISASSEMBLE
        RESERVE: /Scheduler/RESERVE
        PUT_BACK: /Scheduler/PUT_BACK
  cell5:
    logging_level: ERROR
    parameters:
      data_model_path: "resource/data-model/opcua_cell5.yml"
  cell4:
    logging_level: ERROR
    parameters:
      data_model_path: "resource/data-model/opcua_cell4.yml"
