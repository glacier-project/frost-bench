time_precision: MSECS
logging_level: ERROR
reactors:
  frost_bus:
    logging_level: ERROR
    parameters:
      data_model_path: "resource/data-model/bus.yml"
  conveyor:
    logging_level: ERROR
    parameters:
      data_model_path: "resource/data-model/opcua_conveyor_full.yml"
      conveyor_graph: "resource/conveyor-graph.gml"
    reactors:
      conveyor_belt:
        reactors:
          Segment_1:
            parameters:
              segment_time: 17340
          Segment_2:
            parameters:
              segment_time: 22038
          Segment_3:
            parameters:
              segment_time: 17778
          Segment_4:
            parameters:
              segment_time: 8670
          Segment_5:
            parameters:
              segment_time: 9861
          Segment_6:
            parameters:
              segment_time: 17144
          Segment_7:
            parameters:
              segment_time: 20200
          Segment_8:
            parameters:
              segment_time: 18160         
  scheduler:
    logging_level: ERROR
    parameters:
      data_model_path: "resource/data-model/distance_scheduler.yml"
      wh_tasks: 5
      mill_tasks: 5
      rbtc_tasks: 5
      qc_tasks: 5
      min_task_spacing: 15 # seconds
      max_task_spacing: 20 # seconds
      task_mapping:
        ToWarehouseAndBack: /Scheduler/ToWarehouseAndBack
        ToQcAndBack: /Scheduler/ToQcAndBack
        ToRbtcAndBack: /Scheduler/ToRbtcAndBack
        ToMillAndBack: /Scheduler/ToMillAndBack
        WaitPalletAtSegment: /Scheduler/WaitPalletAtSegment
