name: "scheduler" 
root:
  !!FolderNode
  name: "Scheduler"
  description: ""
  children:
    - !!CompositeMethodNode
      name: "RBTC"
      parameters:
        - !!NumericalVariableNode
          name: "reservationId"
          default_value: 0
      returns:
        - !!NumericalVariableNode
          name: "pallet"
          default_value: 0
      cfg:        
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/UtilityMethods/reservePalletOfTypeWithDestination"
          args: [1, -1, -1, -1, -1, 25]  # num of pallets, contentPos1, contentPos2, contentPos3, type
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/UtilityMethods/callReservedPalletTo"
          args: ["${reservationId}", 25]  # reservationId, destination
        - !!WaitRemoteEventNode
          remote_id: "conveyor"
          variable: "/Objects/ConveyorHMI/ConveyorDataExchange/Destinations/destination_palletid_3_1"
          rhs: "${pallet}"
          operator: "=="
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/UtilityMethods/reservePalletOfTypeWithDestination"
          args: [1, -1, -1, -1, -1, 25]  # num of pallets, contentPos1, contentPos2, contentPos3, type
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/releasePallet"
          args: ["${pallet}"]  # pallet number  
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/setPalletDestination"
          args: ["${pallet}", 0]  # pallet number, destination
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/UtilityMethods/callReservedPalletTo"
          args: ["${reservationId}", 25]  # reservationId, destination
        - !!WaitRemoteEventNode
          remote_id: "conveyor"
          variable: "/Objects/ConveyorHMI/ConveyorDataExchange/Destinations/destination_palletid_3_1"
          rhs: "${pallet}"
          operator: "=="
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/setPalletDestination"
          args: ["${pallet}", 0]  # pallet number, destination
    - !!CompositeMethodNode
      name: "QC"
      parameters:
        - !!NumericalVariableNode
          name: "pallet"
          default_value: 0
      cfg:
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/setPalletDestination"
          args: ["${pallet}", 34]  # pallet number, destination
        - !!WaitRemoteEventNode
          remote_id: "conveyor"
          variable: "/Objects/ConveyorHMI/ConveyorDataExchange/Destinations/destination_palletid_4_2"
          rhs: "${pallet}"
          operator: "==" 
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/setPalletDestination"
          args: ["${pallet}", 0]  # pallet number, destination
    - !!CompositeMethodNode
      name: "DISASSEMBLE"
      parameters:
        - !!NumericalVariableNode
          name: "pallet"
          default_value: 0
      returns:
        - !!NumericalVariableNode
          name: "reservationId"
          default_value: 0
      cfg:
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/setPalletDestination"
          args: ["${pallet}", 25]  # pallet number, destination
        - !!WaitRemoteEventNode
          remote_id: "conveyor"
          variable: "/Objects/ConveyorHMI/ConveyorDataExchange/Destinations/destination_palletid_3_1"
          rhs: "${pallet}"
          operator: "=="       
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/UtilityMethods/reservePalletOfTypeWithDestination"
          args: [1, -1, -1, -1, -1, 25]  # num of pallets, contentPos1, contentPos2, contentPos3, type   
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/releasePallet"
          args: ["${pallet}"]  # pallet number
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/setPalletDestination"
          args: ["${pallet}", 0]  # pallet number, destination
    - !!CompositeMethodNode
      name: "PUT_BACK"
      parameters:
        - !!NumericalVariableNode
          name: "reservationId"
          default_value: 0
      cfg:        
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/UtilityMethods/callReservedPalletTo"
          args: ["${reservationId}", 25]  # reservationId, destination
        - !!WaitRemoteEventNode
          remote_id: "conveyor"
          variable: "/Objects/ConveyorHMI/ConveyorDataExchange/Destinations/destination_palletid_3_1"
          rhs: "${pallet}"
          operator: "=="
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/releasePallet"
          args: ["${pallet}"]  # pallet number     
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/setPalletDestination"
          args: ["${pallet}", 0]  # reservationId, destination