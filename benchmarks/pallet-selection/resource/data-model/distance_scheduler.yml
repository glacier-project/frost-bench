name: "scheduler"
root:
  !!FolderNode
  name: "Scheduler"
  description: ""
  children:
    - !!CompositeMethodNode
      name: "WaitPalletAtSegment"
      parameters:
        - !!StringVariableNode
          name: "segment_name"
        - !!StringVariableNode
          name: "palletNumber"
      cfg:
        - !!WaitRemoteEventNode
          remote_id: "conveyor"
          variable: "/Objects/ConveyorHMI/ConveyorObjects/Segments/${segment_name}/FIFO/item0"
          rhs: "${palletNumber}"
          operator: "=="
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/releasePallet"
          kwargs:
            palletNumber: ${palletNumber}
    - !!CompositeMethodNode
      name: "ToWarehouseAndBack"
      parameters:
        - !!StringVariableNode
          name: "machine"
          default_value: ""
        - !!NumericalVariableNode
          name: "destination"
          default_value: 40
        - !!StringVariableNode
          name: "destination_name"
          default_value: "destination_palletid_5"
      cfg:
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/UtilityMethods/reservePalletOfTypeWithDestination"
          kwargs:
            numPallets: 1
            contentPos1: -1
            contentPos2: -1
            contentPos3: -1
            palletType: -1
            destination: ${destination}
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/UtilityMethods/getReservedPallet"
          kwargs:
            reservationId: ${reservationId}
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/setPalletDestination"
          kwargs:
            palletNumber: ${pallet}
            destination: ${destination}
        - !!WaitRemoteEventNode
          remote_id: "conveyor"
          variable: "/Objects/ConveyorHMI/ConveyorDataExchange/Destinations/${destination_name}"
          rhs: "${pallet}"
          operator: "=="
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/setPalletDestination"
          kwargs:
            palletNumber: ${pallet}
            destination: 0
        - !!CallRemoteMethodNode
          remote_id: "conveyor"
          method: "/Objects/ConveyorHMI/ConveyorDataExchange/Commands/ConveyorCommandsPointer/releasePallet"
          kwargs:
            palletNumber: ${pallet}
