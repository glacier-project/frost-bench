time_precision: MSECS
logging_level: ERROR
reactors:
  frost_link:
    logging_level: ERROR
    parameters:
      data_model_path: "../../ice-frost/resources/data_model/frost_link.yml"
  conveyor:
    logging_level: ERROR
    parameters:
      data_model_path: "resource/data-model/opcua_conveyor_full.yml"
      conveyor_graph: "resource/conveyor-graph.gml"
  scheduler:
    logging_level: ERROR
    parameters:
      data_model_path: "resource/data-model/lego_movements_scheduler.yml"
      scheduling_instance: "../../ice-frost/resources/schedules/simulation-lego-demo.json"
      task_mapping:
        RBTC: /Scheduler/RBTC
        QC: /Scheduler/QC
        DISASSEMBLE: /Scheduler/DISASSEMBLE
        PUT_BACK: /Scheduler/PUT_BACK
